<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>screensaver mirror</title>
<link rel="icon" href="data:," />
<style>
  :root {
    color-scheme: dark;
    --ink: #4b8b4b;
    --hot: #7cf65d;
    --rule: #132;
    --edge: #3a6;
    --bad: #f66;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    box-sizing: border-box;
    /* Three regions and no page scroll: the list and the bar scroll inside
       themselves, so the canvas never moves when either grows. */
    display: grid;
    grid-template-columns: 15rem minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas:
      "side stage"
      "side bar";
    font:
      12px ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
    color: var(--ink);
  }
  /* The rows set `display`, which beats the attribute's own display: none. */
  [hidden] {
    display: none !important;
  }
  button,
  input,
  select {
    font: inherit;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: #000;
    border: 1px solid var(--rule);
    padding: 0.2rem 0.45rem;
  }
  button {
    cursor: pointer;
    white-space: nowrap;
  }
  button[aria-pressed="true"] {
    color: var(--hot);
    border-color: var(--edge);
  }
  input[type="checkbox"],
  input[type="range"] {
    accent-color: var(--edge);
  }
  input:disabled {
    opacity: 0.4;
  }

  /* ── saver list ─────────────────────────────── */
  #side {
    grid-area: side;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--rule);
  }
  #filter {
    margin: 0.5rem;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 0 0 1rem;
    outline: none;
  }
  #list h2 {
    position: sticky;
    top: 0;
    margin: 0;
    padding: 0.45rem 0.6rem 0.25rem;
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.6;
    background: #000;
  }
  #list button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    border-left: 2px solid transparent;
    padding: 0.22rem 0.6rem 0.22rem 0.9rem;
  }
  #list button:hover,
  #list button.cursor {
    background: #071207;
  }
  #list button[aria-current="true"] {
    color: var(--hot);
    border-left-color: var(--edge);
  }
  #side .none {
    padding: 0.6rem;
    opacity: 0.6;
  }
  #drawer {
    display: none;
  }

  /* ── the panel ──────────────────────────────── */
  #stage {
    grid-area: stage;
    min-width: 0;
    min-height: 0;
    display: grid;
    /* `size` can be bigger than the room on purpose; it scrolls rather than
       shrinking, because shrinking is what `ratio` is for. Centred by the
       canvas's auto margins, not place-items: those collapse to 0 when it
       overflows, where centring would push its left edge out of reach. */
    overflow: auto;
  }
  #stage canvas {
    margin: auto;
  }
  canvas {
    /* Width and height are set from JS in both modes — see applyActualSize().
       CSS max-width/max-height on auto sizes keep the canvas's INTRINSIC 16:9,
       so the panel's 3.2:1 never reached the page and `ratio` just blew the
       framebuffer up to fill the window.
       image-rendering is set per layout — see fitScaling(). `pixelated` is right when the
       canvas is shown at or above its own size, and WRONG below it: nearest
       neighbour at a fractional downscale drops whole rows and columns of
       pixels, which is the line striping the mirror was showing. */
    border: 1px solid var(--rule);
    background: #000;
  }

  /* ── bottom bar ─────────────────────────────── */
  #bar {
    grid-area: bar;
    max-height: 40vh;
    overflow-y: auto;
    border-top: 1px solid var(--rule);
    padding: 0.5rem 0.75rem 0.4rem;
    display: grid;
    gap: 0.5rem;
  }
  #bar section {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.9rem;
  }
  #bar h3 {
    margin: 0;
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.6;
    min-width: 4.5rem;
  }
  #cfgname {
    color: var(--hot);
  }
  #knobs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 0.9rem;
  }
  .knob {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .knob input[type="number"] {
    width: 5.5rem;
  }
  .knob input[type="text"] {
    width: 6rem;
  }
  .knob.set > span {
    color: var(--hot);
  }
  .knob button {
    padding: 0 0.3rem;
    border-color: transparent;
  }
  .knob .err {
    color: var(--bad);
  }
  #rotmins {
    width: 4rem;
  }
  #pool label {
    margin-right: 0.4rem;
  }
  #status {
    font-size: 10px;
    letter-spacing: 0.08em;
    opacity: 0.6;
  }
  #status b {
    color: var(--hot);
    font-weight: 500;
  }

  /* In the bar, not over it. The slider must not move while it is dragged,
     and the live preview resizes the canvas on every input event — but the
     canvas is in the stage, whose size the bar sets and the canvas never
     does, so the strip stays put. Opening it grows the bar once, which is
     the stage giving up the strip's height, the same as a reserved strip. */
  #cal:not([hidden]) {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 0 0.2rem;
    border-top: 1px solid var(--rule);
  }
  #cal p {
    max-width: 34rem;
    margin: 0;
    text-align: center;
    line-height: 1.5;
  }
  #card {
    height: 1.6rem;
    border: 1px solid var(--edge);
    border-radius: 3px;
    background: repeating-linear-gradient(90deg, #132 0 8px, #0a1a0a 8px 16px);
  }
  #slider {
    width: min(20rem, 90vw);
  }
  #calrow {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  #calnow {
    opacity: 0.7;
  }

  /* Phone: the list is a drawer over the page, opened from a button above
     the canvas, so the canvas gets the whole width. */
  @media (max-width: 720px) {
    body {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "top" "stage" "bar";
    }
    #drawer {
      display: block;
      grid-area: top;
      margin: 0.5rem 0.75rem 0;
      text-align: left;
    }
    #side {
      position: fixed;
      inset: 0 25% 0 0;
      z-index: 3;
      background: #000;
      transform: translateX(-102%);
      transition: transform 0.15s;
    }
    body.drawer #side {
      transform: none;
      box-shadow: 0 0 0 100vmax #000a;
    }
    #bar {
      max-height: 45vh;
    }
  }
</style>
<aside id="side">
  <input id="filter" type="search" placeholder="filter savers" autocomplete="off" />
  <div id="list" tabindex="0" role="listbox" aria-label="savers"></div>
</aside>
<button id="drawer" aria-expanded="false">☰ <span id="drawername">savers</span></button>
<main id="stage"><canvas id="screen" width="16" height="16"></canvas></main>
<footer id="bar">
  <section id="cfg">
    <h3>saver</h3>
    <span id="cfgname"></span>
    <label id="wide" hidden><input id="wideon" type="checkbox" /> expanded</label>
    <div id="knobs"></div>
  </section>
  <section>
    <h3>rotate</h3>
    <label><input id="roton" type="checkbox" /> auto-rotate</label>
    <label>every <input id="rotmins" type="number" min="1" max="1440" step="1" /> min</label>
    <span id="pool"></span>
  </section>
  <section>
    <h3>view</h3>
    <span id="modes" hidden
      >actual <button id="mratio">ratio</button> <button id="msize">size</button>
      <button id="calopen">calibrate</button></span
    >
    <span id="status">connecting…</span>
  </section>
  <div id="cal" hidden>
    <p>
      Hold a credit card against the screen and drag until the bar matches its
      long edge. Every card is 85.6 mm — it is the one ruler everyone owns.
    </p>
    <div id="card"></div>
    <input id="slider" type="range" min="1.0" max="12.0" step="0.01" />
    <div id="calrow">
      <button id="caldone">done</button>
      <button id="calreset">reset</button>
      <span id="calnow"></span>
    </div>
  </div>
</footer>
<script>
  const canvas = document.getElementById("screen");
  const stage = document.getElementById("stage");
  const status = document.getElementById("status");
  const ctx = canvas.getContext("2d", { alpha: false });

  let meta = null,
    atlas = [],
    solid = [],
    blank = [],
    frames = 0,
    cells = 0;

  const hex = (v) => "#" + v.toString(16).padStart(6, "0");
  const el = (tag, props = {}, ...kids) => {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...kids);
    return e;
  };

  // One atlas per palette colour: every glyph drawn in that colour, once. A cell
  // is then a fillRect plus one drawImage, with no per-pixel work in JS.
  function buildAtlases(m) {
    const { glyph_w: gw, glyph_h: gh, glyphs, palette } = m;
    atlas = palette.map((colour) => {
      const c = new OffscreenCanvas(glyphs.length * gw, gh);
      const g = c.getContext("2d");
      const img = g.createImageData(c.width, gh);
      const [r, gr, b] = [
        (colour >> 16) & 255,
        (colour >> 8) & 255,
        colour & 255,
      ];
      glyphs.forEach((rows, i) => {
        for (let y = 0; y < gh; y++) {
          const line = rows[y];
          for (let x = 0; x < gw; x++) {
            if (!(line & (0x80 >> x))) continue;
            const o = (y * c.width + i * gw + x) * 4;
            img.data[o] = r;
            img.data[o + 1] = gr;
            img.data[o + 2] = b;
            img.data[o + 3] = 255;
          }
        }
      });
      g.putImageData(img, 0, 0);
      return c;
    });
    // Glyphs that are wholly on or wholly off need no blit at all — that is
    // what `blocks` is made of, and it is 130k cells.
    solid = glyphs.map((rows) => rows.every((v) => v === 0xff));
    blank = glyphs.map((rows) => rows.every((v) => v === 0x00));
  }

  // The tailnet is the auth boundary (the ts-auth sidecar 403s anything without
  // an identity header), so there is nothing to send but the name.
  async function select(name) {
    const res = await fetch("/select?saver=" + encodeURIComponent(name), {
      method: "POST",
      cache: "no-store",
    });
    // A rejected name leaves the panel alone; say so rather than lying about it.
    if (!res.ok) {
      status.textContent = "cannot draw " + name;
      return;
    }
    // The switch bumps the mirror's epoch, so the server is about to close the
    // stream. Abort it ourselves instead of waiting to be dropped: a chunked
    // response closed mid-read REJECTS reader.read() (Safari: "Load failed")
    // rather than resolving done, so letting the server do it turned every
    // successful switch into a two-second error banner.
    status.textContent = "switching to " + name + "…";
    switching = true;
    abort();
  }

  // ── SAVER LIST ───────────────────────────────────────────────────────
  //
  // Sections and the scene/-wide pairing come from /meta, not from here: the
  // table lives beside the savers in Rust, so a new saver shows up in the
  // right place without touching this page. A scene with a full-width twin is
  // listed once; `expanded` in the bar picks which of the two draws.
  const list = document.getElementById("list");
  const filter = document.getElementById("filter");
  let items = []; // [{name, button}] in list order
  let cursor = -1; // index into the VISIBLE items, for the arrow keys
  let base = {}; // "night-coast-wide" -> "night-coast"

  const shown = (n) => base[n] || n;
  const label = (n) => n.replace(/-/g, " ");

  function buildList(m) {
    base = Object.fromEntries(Object.entries(m.wide).map(([b, w]) => [w, b]));
    items = [];
    list.replaceChildren(
      ...m.groups.flatMap((g) => {
        if (!g.savers.length) return [];
        const buttons = g.savers.map((name) => {
          const b = el("button", { textContent: label(name), role: "option" });
          b.dataset.name = name;
          b.onclick = () => pick(name);
          items.push({ name, button: b, group: g.name });
          return b;
        });
        return [el("h2", { textContent: g.name }), ...buttons];
      }),
    );
    applyFilter();
  }

  // The row a click on `name` asks for: the twin the viewer is already
  // looking at, so moving between scenes keeps `expanded` as it was.
  function pick(name) {
    closeDrawer();
    const wide = meta.wide[name];
    select(wide && meta.saver === meta.wide[shown(meta.saver)] ? wide : name);
  }

  function visible() {
    return items.filter((it) => !it.button.hidden);
  }

  function applyFilter() {
    const q = filter.value.trim().toLowerCase();
    for (const it of items)
      it.button.hidden = !!q && !(label(it.name) + " " + it.group).includes(q);
    for (const h of list.querySelectorAll("h2")) {
      let n = h.nextElementSibling,
        any = false;
      for (; n && n.tagName === "BUTTON"; n = n.nextElementSibling)
        any ||= !n.hidden;
      h.hidden = !any;
    }
    list.querySelector(".none")?.remove();
    if (!visible().length) list.append(el("div", { className: "none", textContent: "no saver matches" }));
    moveCursor(0, true);
  }

  // `d` steps through the visible rows; `reset` lands on the current saver,
  // or the first match while filtering.
  function moveCursor(d, reset) {
    const v = visible();
    for (const it of items) it.button.classList.remove("cursor");
    if (!v.length) return (cursor = -1);
    if (reset) {
      const cur = v.findIndex((it) => meta && it.name === shown(meta.saver));
      cursor = filter.value.trim() || cur < 0 ? 0 : cur;
      if (!filter.value.trim()) return;
    } else cursor = Math.max(0, Math.min(v.length - 1, cursor + d));
    v[cursor].button.classList.add("cursor");
    v[cursor].button.scrollIntoView({ block: "nearest" });
  }

  function onListKey(e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      moveCursor(e.key === "ArrowDown" ? 1 : -1, cursor < 0);
    } else if (e.key === "Enter") {
      const v = visible();
      if (cursor < 0 && v.length) cursor = 0;
      if (v[cursor]) pick(v[cursor].name);
    } else if (e.key === "Escape") {
      filter.value = "";
      applyFilter();
      closeDrawer();
    }
  }
  filter.oninput = applyFilter;
  filter.onkeydown = onListKey;
  list.onkeydown = onListKey;

  function markCurrent() {
    for (const it of items) {
      const on = it.name === shown(meta.saver);
      it.button.setAttribute("aria-current", String(on));
      if (on) it.button.scrollIntoView({ block: "nearest" });
    }
    document.getElementById("drawername").textContent = label(shown(meta.saver));
  }

  const drawer = document.getElementById("drawer");
  function closeDrawer() {
    document.body.classList.remove("drawer");
    drawer.setAttribute("aria-expanded", "false");
  }
  drawer.onclick = () => {
    const open = !document.body.classList.contains("drawer");
    document.body.classList.toggle("drawer", open);
    drawer.setAttribute("aria-expanded", String(open));
    if (open) {
      markCurrent();
      filter.focus();
    }
  };
  // A tap on the dimmed page beside the open drawer closes it.
  document.addEventListener("pointerdown", (e) => {
    if (document.body.classList.contains("drawer") && !e.target.closest("#side, #drawer"))
      closeDrawer();
  });

  // ── PER-SAVER CONFIG ─────────────────────────────────────────────────
  //
  // Whatever knobs the saver's constructor reads, as /config reports them —
  // the page knows no saver's knobs. A change is posted at once; the server
  // validates against the constructor's own range, and rebuilds the saver
  // when it reads that key, which ends this stream like any switch.
  const knobs = document.getElementById("knobs");
  const wideBox = document.getElementById("wide");
  const wideOn = document.getElementById("wideon");
  let cfgFor = null; // the epoch the knobs were fetched for

  wideOn.onchange = () => {
    const b = shown(meta.saver);
    select(wideOn.checked ? meta.wide[b] : b);
  };

  async function loadConfig(force) {
    if (!force && cfgFor === meta.epoch) return;
    cfgFor = meta.epoch;
    const name = meta.saver;
    document.getElementById("cfgname").textContent = label(shown(name));
    const pair = meta.wide[shown(name)];
    wideBox.hidden = !pair;
    wideOn.checked = !!pair && name === pair;
    const res = await fetch("/config?saver=" + encodeURIComponent(name), { cache: "no-store" });
    if (!res.ok || name !== meta.saver) return;
    showKnobs(name, await res.json());
  }

  // What the rows were built from. The reconnect after a write fetches the
  // same list the write already returned; rebuilding the rows for it would
  // throw away whatever the viewer has started typing in the next box.
  let knobsShown = "";

  function showKnobs(name, list) {
    const json = name + JSON.stringify(list);
    if (json === knobsShown) return;
    knobsShown = json;
    knobs.replaceChildren(
      ...list.map((k) => knobRow(name, k)),
      ...(list.length ? [] : [el("span", { textContent: "no settings" })]),
    );
  }

  function knobRow(name, k) {
    const row = el("label", { className: "knob" + (k.overridden ? " set" : ""), title: [k.key, k.help].filter(Boolean).join(" — ") });
    const err = el("span", { className: "err" });
    let input;
    if (k.kind === "bool") {
      input = el("input", { type: "checkbox", checked: k.value === 1 });
      row.append(input, el("span", { textContent: k.label }));
    } else {
      input =
        k.kind === "num"
          ? el("input", { type: "number", min: k.lo, max: k.hi, step: 1, value: k.value })
          : el("input", { type: "text", value: k.value, maxLength: 64 });
      row.append(el("span", { textContent: k.label }), input);
    }
    input.onchange = async () => {
      const v = k.kind === "bool" ? (input.checked ? 1 : 0) : input.value;
      const r = await send(name, "POST", k.key, v);
      if (r.error) {
        err.textContent = r.error.replace(k.key + ": ", "");
        // Back to what the saver is really using: a refused value changes
        // nothing on the panel, so it must not stay in the box either.
        if (k.kind === "bool") input.checked = k.value === 1;
        else input.value = k.value;
      }
    };
    if (k.overridden) {
      const reset = el("button", { textContent: "↺", title: "back to " + k.default });
      reset.onclick = (e) => {
        e.preventDefault();
        send(name, "DELETE", k.key);
      };
      row.append(reset);
    }
    row.append(err);
    return row;
  }

  async function send(name, method, key, value) {
    let q = "/config?saver=" + encodeURIComponent(name) + "&key=" + encodeURIComponent(key);
    if (value !== undefined) q += "&value=" + encodeURIComponent(value);
    const res = await fetch(q, { method, cache: "no-store" });
    const body = await res.json();
    if (!res.ok) return body;
    // The new list now, before the rebuild's reconnect re-fetches it: a knob
    // that shows or hides others (the tour's switch) should look instant.
    if (name === meta.saver) showKnobs(name, body.knobs);
    // A rebuild ends the stream; drop it ourselves, as `select` does.
    if (body.rebuilt) {
      switching = true;
      abort();
    }
    return {};
  }

  // Rotation. The interval is the pod's, not this tab's — /meta carries it, so
  // a second browser shows what the first one set rather than its own guess.
  // Seconds on the wire because that is the renderer's unit and what
  // SAVER_ROTATE_SECS is in; minutes here because that is what a person asks
  // for. An interval that is not a whole number of minutes (only reachable from
  // the env var) shows rounded.
  const roton = document.getElementById("roton");
  const rotmins = document.getElementById("rotmins");
  // What the box goes back to when it is ticked again — turning rotation off
  // must not also forget the interval, which posting 0 does on the server.
  let rotlast = 5;

  function showRotate(secs) {
    roton.checked = secs > 0;
    if (secs > 0) rotlast = Math.max(1, Math.round(secs / 60));
    rotmins.value = rotlast;
    rotmins.disabled = !roton.checked;
  }

  async function setRotate(mins) {
    const res = await fetch("/rotate?mins=" + mins, {
      method: "POST",
      cache: "no-store",
    });
    if (!res.ok) {
      status.textContent = "cannot rotate every " + mins + " min";
      return;
    }
    showRotate((await res.json()).rotate_secs);
  }

  roton.onchange = () => setRotate(roton.checked ? rotlast : 0);
  rotmins.onchange = () => {
    rotlast = Math.min(1440, Math.max(1, Math.round(+rotmins.value) || 1));
    setRotate(roton.checked ? rotlast : 0);
  };

  // The sections rotation may pick from. At least one stays ticked: an empty
  // pool is refused by the server, and unticking the last box says so here.
  const pool = document.getElementById("pool");
  function showPool(m) {
    if (!pool.childElementCount)
      pool.replaceChildren(
        "from ",
        ...m.groups.map((g) => {
          const box = el("input", { type: "checkbox" });
          box.dataset.group = g.name;
          box.onchange = setPool;
          return el("label", {}, box, " " + g.name);
        }),
      );
    for (const box of pool.querySelectorAll("input"))
      box.checked = m.pool.includes(box.dataset.group);
  }

  async function setPool() {
    const on = [...pool.querySelectorAll("input:checked")].map((b) => b.dataset.group);
    const res = await fetch("/pool?groups=" + encodeURIComponent(on.join(",")), {
      method: "POST",
      cache: "no-store",
    });
    if (!res.ok) {
      status.textContent = "rotation needs at least one group";
      showPool(meta);
      return;
    }
    meta.pool = (await res.json()).pool;
    showPool(meta);
  }

  // ACTUAL SIZE
  //
  // CSS cannot know how big the viewer's monitor is. `width: 200mm` is 200mm
  // only if the browser's CSS inch happens to be a real inch, which on a scaled
  // or HiDPI display it is not — so the viewer calibrates once, against the one
  // ruler everybody owns: an ID-1 card (ISO/IEC 7810) is 85.60mm, to a tenth of
  // a millimetre, in every wallet on earth.
  //
  // Per-viewer and per-device, so it lives in localStorage and never travels.
  // Wrapped because a private window or blocked site data throws on access
  // rather than returning null.
  const CARD_MM = 85.6;
  const PXMM = "mirror.pxPerMm";

  // 96 CSS px to the inch is what the spec nominally says, and it is the only
  // guess available before the viewer has measured anything. It is within a few
  // per cent on an unscaled display and can be well out on a scaled or HiDPI
  // one — which is the whole reason `calibrate` exists. Being approximately
  // right by default beats being exactly right only for people who click.
  const NOMINAL_PX_MM = 96 / 25.4;

  function calibrated() {
    try {
      const v = parseFloat(localStorage.getItem(PXMM));
      return v > 0 ? v : 0;
    } catch {
      return 0;
    }
  }

  // The view state lives here, not in storage: a saver switch or a rotation
  // re-reads /meta, and that must not hand the viewer back a different size.
  // Storage only seeds it, and a private window that cannot store still keeps
  // its calibration for as long as the tab is open.
  let pxmm = calibrated();
  // While calibrate is open the slider IS the size being previewed, so it
  // survives a switch just as the committed one does.
  function pxPerMm() {
    return (!cal.hidden && parseFloat(slider.value)) || pxmm || NOMINAL_PX_MM;
  }

  function setPxPerMm(v) {
    pxmm = v;
    try {
      if (v) localStorage.setItem(PXMM, String(v));
      // Removing the key rather than storing the nominal value, so a later
      // browser with a better answer is not permanently overridden by today's
      // guess.
      else localStorage.removeItem(PXMM);
    } catch {
      /* calibration just does not persist; the session still works */
    }
  }

  // Two ways to be faithful to the panel, and they are not the same thing:
  //
  //   ratio — the panel's SHAPE, scaled to fit the window. Always exactly
  //           right, because it needs nothing the browser cannot know.
  //   size  — the panel's SHAPE AND PHYSICAL SIZE. Needs px-per-mm, which
  //           only the viewer can supply, so it is exact after `calibrate`
  //           and a nominal-inch guess before.
  //
  // Remembered per device: someone who wants one of them usually wants it
  // every time.
  const MODEKEY = "mirror.mode";
  let mode = "size";
  try {
    const m = localStorage.getItem(MODEKEY);
    if (m === "ratio" || m === "size") mode = m;
  } catch {
    /* keep the default */
  }

  function setMode(m) {
    mode = m;
    try {
      localStorage.setItem(MODEKEY, m);
    } catch {
      /* the choice just does not persist */
    }
    applyActualSize();
  }

  const modes = document.getElementById("modes");
  const mratio = document.getElementById("mratio");
  const msize = document.getElementById("msize");
  const cal = document.getElementById("cal");
  const slider = document.getElementById("slider");
  const card = document.getElementById("card");
  const calnow = document.getElementById("calnow");

  // Without a measured panel `size` cannot be honest about millimetres, so it
  // is not offered — but `mode` is left alone, so the viewer's choice is still
  // there if a later /meta does carry one.
  const sized = () => mode === "size" && meta && meta.panel_mm > 0;

  // The PANEL's shape, not the framebuffer's. With SAVER_PIXEL_ASPECT set the
  // renderer draws everything `aspect` per-cent too tall on purpose, because
  // the monitor squashes it back; the page has no monitor, so it squashes
  // here. Displayed shape only — the pixels are the framebuffer's.
  const aspect = () =>
    (meta.panel_w * meta.pixel_aspect) / (meta.panel_h * 100);

  // Keeps the canvas off the stage's edge.
  const MARGIN = 8;

  // The box the canvas's content must fit in, in both modes: the stage, which
  // the grid has already sized to whatever the list and the bar leave, less
  // the canvas's own border, which sits outside the width set from JS.
  function room() {
    const border = canvas.offsetWidth - canvas.clientWidth;
    return [stage.clientWidth - border - MARGIN, stage.clientHeight - border - MARGIN];
  }

  function paintModes(tooBig) {
    mratio.setAttribute("aria-pressed", String(!sized()));
    msize.setAttribute("aria-pressed", String(sized()));
    // Say WHICH number `size` is using: uncalibrated it is the browser's
    // nominal inch, a guess, and a viewer holding the page against the real
    // panel deserves to know that before concluding the maths is wrong.
    msize.textContent = tooBig
      ? "size — too big for this window"
      : pxmm
        ? "size ✓"
        : "size";
    msize.title = pxmm
      ? "matched to your screen"
      : "using the browser's nominal 96dpi — calibrate to make it exact";
  }

  function applyActualSize() {
    if (!meta) return;
    modes.hidden = !meta.panel_mm;
    const ar = aspect();
    const [rw, rh] = room();
    let w, h;
    if (sized()) {
      // A fixed physical size: an oversized panel must overflow and say so
      // rather than be shrunk.
      w = meta.panel_mm * pxPerMm();
      h = w / ar;
    } else {
      w = Math.max(16, Math.min(rw, rh * ar));
      h = w / ar;
    }
    paintModes(sized() && (w > rw || h > rh));
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    fitScaling();
  }

  function drawCard() {
    const k = parseFloat(slider.value);
    card.style.width = CARD_MM * k + "px";
    calnow.textContent = `${(k * 25.4).toFixed(0)} dpi · panel ${(meta.panel_mm * k) | 0}px wide`;
  }

  // The stage shrinks when the strip opens; the ResizeObserver on it re-fits
  // the canvas, so there is no separate resize path here.
  function showCal(open) {
    cal.hidden = !open;
    applyActualSize();
  }

  mratio.onclick = () => setMode("ratio");
  msize.onclick = () => setMode("size");
  document.getElementById("calopen").onclick = () => {
    slider.value = pxPerMm();
    drawCard();
    showCal(cal.hidden);
  };
  // A live preview while dragging: the canvas resizes above the slider, so
  // the viewer sees the panel grow toward its real size rather than having to
  // commit and then judge.
  function previewSlider() {
    drawCard();
    applyActualSize();
  }
  slider.oninput = previewSlider;
  document.getElementById("calreset").onclick = () => {
    setPxPerMm(0);
    slider.value = NOMINAL_PX_MM;
    previewSlider();
  };
  document.getElementById("caldone").onclick = () => {
    setPxPerMm(parseFloat(slider.value));
    showCal(false);
    // Calibrating is only meaningful for `size`, so finishing implies it.
    setMode("size");
  };

  // Width of the largest cell count this scene can report, so both counters
  // below are padded to the same fixed width.
  let padTo = 1;

  function pad(v) {
    return String(v).padStart(padTo, "0");
  }

  // A 1920-wide canvas in a smaller window is a fractional downscale, and
  // nearest-neighbour picks one source pixel per destination pixel, so entire
  // scanlines vanish — a one-cell-tall streak or a one-pixel grid line can
  // disappear completely. Smoothing averages instead of dropping, which is the
  // honest rendering when the mirror cannot show every pixel. Above 1:1 we want
  // hard edges back, because that is what the panel itself looks like.
  function fitScaling() {
    const shown = canvas.clientWidth;
    if (!shown) return;
    const ratio = shown / canvas.width;
    const crisp = ratio >= 1 || Number.isInteger(1 / ratio);
    canvas.style.imageRendering = crisp ? "pixelated" : "auto";
  }
  // The stage, not the window: the bar grows when a saver has more knobs, and
  // that shrinks the room `ratio` fits into without any window resize.
  new ResizeObserver(applyActualSize).observe(stage);

  function applyMeta(m) {
    const first = !meta;
    meta = m;
    if (first) buildList(m);
    markCurrent();
    showRotate(m.rotate_secs);
    showPool(m);
    loadConfig(false);
    // The PANEL, not the cell grid — see Grid::new on why they differ.
    //
    // No fallback for a /meta missing these: this page is include_str!'d into
    // the binary that serves /meta, so a page holding this code is always
    // talking to a pod that sends them.
    canvas.width = m.panel_w;
    canvas.height = m.panel_h;
    ctx.imageSmoothingEnabled = false;
    padTo = String(m.cols * m.rows).length;
    applyActualSize();
    ctx.fillStyle = hex(m.ground);
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    buildAtlases(m);
  }

  // `base` is the record's offset inside the shared receive buffer: the
  // caller hands over one long-lived DataView rather than slicing a new one
  // per record.
  function draw(view, base) {
    const { cols, cell_w: cw, cell_h: ch, glyph_w: gw, glyph_h: gh } = meta;
    const n = view.getUint32(base, true);
    for (let k = 0; k < n; k++) {
      const o = base + 4 + k * 8;
      const i = view.getUint32(o, true);
      const cell = view.getUint32(o + 4, true);
      const glyph = cell & 0xffff,
        colour = cell >>> 16;
      const x = (i % cols) * cw,
        y = ((i / cols) | 0) * ch;
      if (solid[glyph]) {
        ctx.fillStyle = hex(meta.palette[colour]);
        ctx.fillRect(x, y, cw, ch);
        continue;
      }
      ctx.fillStyle = hex(meta.ground);
      ctx.fillRect(x, y, cw, ch);
      if (!blank[glyph])
        ctx.drawImage(atlas[colour], glyph * gw, 0, gw, gh, x, y, cw, ch);
    }
    frames++;
    cells += n;
    return n;
  }

  // Set while a switch we initiated is tearing the stream down, so the loop can
  // tell "the user pressed a button" apart from "the pod went away".
  let switching = false;
  let ctl = new AbortController();
  const abort = () => ctl.abort();

  async function run() {
    ctl = new AbortController();
    const res = await fetch("/meta", { cache: "no-store", signal: ctl.signal });
    if (!res.ok) throw new Error("no display yet (" + res.status + ")");
    const m = await res.json();
    applyMeta(m);

    // Hand back the epoch /meta was built for. /select can land between these
    // two fetches, and then the cells belong to a saver whose geometry, palette
    // and glyph table are not the ones just applied — which drew the other
    // saver's frames as grey blocks against the old grid, with nothing to
    // recover it. The server refuses the mismatch instead.
    const stream = await fetch("/stream?epoch=" + m.epoch, {
      cache: "no-store",
      signal: ctl.signal,
    });
    // 409 is that refusal. Re-read /meta at once rather than after the 2s
    // reconnect backoff, which would black the panel out on every switch.
    if (stream.status === 409) {
      switching = true;
      throw new Error("scene changed");
    }
    if (!stream.ok) throw new Error("stream " + stream.status);
    const reader = stream.body.getReader();
    // Records straddle chunk boundaries, so hold a buffer and consume only
    // whole ones. Grow-only, with a read offset: the obvious
    // allocate-and-copy-everything per chunk is O(n^2) in chunks per frame,
    // and on `blocks` (37k changed cells a frame, 4.4 MB/s) that measured ~3
    // MB/frame of garbage and showed up as GC spikes. Here a chunk is one
    // `set` into spare room, and consumed bytes are reclaimed by resetting the
    // offset — a compaction only happens when a record really did straddle.
    let buf = new Uint8Array(1 << 16);
    let view = new DataView(buf.buffer);
    let len = 0, // bytes written
      off = 0; // bytes already drawn
    for (;;) {
      const { value, done } = await reader.read();
      // The server ends the stream when the epoch moves, which SAVER_ROTATE_SECS
      // now makes a routine event rather than only a click. Treat it as a
      // switch: reconnect at once and say nothing. Waiting out the 2s backoff
      // would put an error banner on the page every rotation. A pod that really
      // went away fails on the next /meta and gets the banner there.
      if (done) {
        switching = true;
        throw new Error("stream ended");
      }
      if (len + value.length > buf.length) {
        // Drop what has been drawn, and only then consider growing. A full
        // keyframe on `blocks` is ~1 MB, so the buffer does settle larger than
        // its initial size — it just stops churning once it has.
        buf.copyWithin(0, off, len);
        len -= off;
        off = 0;
        if (len + value.length > buf.length) {
          let cap = buf.length;
          while (cap < len + value.length) cap *= 2;
          const grown = new Uint8Array(cap);
          grown.set(buf.subarray(0, len));
          buf = grown;
          view = new DataView(buf.buffer);
        }
      }
      buf.set(value, len);
      len += value.length;
      let n = -1;
      for (;;) {
        if (len - off < 4) break;
        const need = 4 + view.getUint32(off, true) * 8;
        if (len - off < need) break;
        n = draw(view, off);
        off += need;
      }
      // Once per chunk, not once per record: this is a layout-invalidating
      // innerHTML write, and at 30fps the inner loop runs it for every frame
      // that arrived in the same read.
      // Zero-padded to the widest value each field can take — cols*rows — so
      // the line keeps a fixed width. Unpadded, every frame reflows the text
      // and the whole status row twitches sideways 30 times a second, which
      // reads as the page being broken rather than as the numbers changing.
      if (n >= 0)
        status.innerHTML =
          `<b>${meta.saver}</b> · ${meta.cols}x${meta.rows} cells · ` +
          `${pad(n)} changed · ${pad(Math.round(cells / Math.max(frames, 1)))} avg`;
      // The common case: the chunk ended on a record boundary, so the whole
      // buffer is free again without moving a byte.
      if (off === len) off = len = 0;
    }
  }

  // The stream ends on modeset (a new palette and geometry), on a pod restart,
  // and when the tab was backgrounded long enough to be culled. Reconnecting is
  // the whole recovery story — /meta is re-read, so a changed saver just works.
  (async function loop() {
    for (;;) {
      try {
        await run();
      } catch (e) {
        // A switch we asked for is not a failure: reconnect at once and say
        // nothing. Only a real drop gets the banner and the backoff.
        if (switching) {
          switching = false;
          continue;
        }
        status.textContent = e.message + " — retrying";
      }
      await new Promise((r) => setTimeout(r, 2000));
    }
  })();
</script>
