<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>screensaver mirror</title>
<style>
  :root {
    color-scheme: dark;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    font:
      12px ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
    color: #4b8b4b;
  }
  canvas {
    /* Width and height are set from JS in both modes — see applyActualSize().
       CSS max-width/max-height on auto sizes keep the canvas's INTRINSIC 16:9,
       so the panel's 3.2:1 never reached the page and `ratio` just blew the
       framebuffer up to fill the window.
       image-rendering is set per layout — see fitScaling(). `pixelated` is right when the
       canvas is shown at or above its own size, and WRONG below it: nearest
       neighbour at a fractional downscale drops whole rows and columns of
       pixels, which is the line striping the mirror was showing. */
    border: 1px solid #132;
    background: #000;
  }
  #status {
    letter-spacing: 0.08em;
    opacity: 0.75;
  }
  #status b {
    color: #7cf65d;
    font-weight: 500;
  }
  #pick {
    display: flex;
    /* Eighteen savers do not fit on one line, and a picker that runs off the
       edge hides the savers at the end of the list entirely. Wrap and centre,
       so the row grows downward instead of sideways. */
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem;
    max-width: 100%;
  }
  #pick button {
    font: inherit;
    letter-spacing: 0.08em;
    color: #4b8b4b;
    background: #000;
    border: 1px solid #132;
    /* Tighter than before: the horizontal padding was set when there were
       three savers and is what pushes the row past the edge at eighteen. */
    padding: 0.25rem 0.55rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #modes {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  #modes button {
    margin-left: 0.2rem;
  }
  #life {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }
  /* Pinned: the live preview resizes the canvas above it on every input
     event, and in the flow that moved the slider out from under the pointer
     mid-drag. Its height is reserved as body padding while open. */
  #cal:not([hidden]) {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    background: #000;
    border-top: 1px solid #132;
  }
  #cal p {
    max-width: 34rem;
    margin: 0;
    text-align: center;
    line-height: 1.5;
  }
  #card {
    height: 1.6rem;
    border: 1px solid #3a6;
    border-radius: 3px;
    background: repeating-linear-gradient(90deg, #132 0 8px, #0a1a0a 8px 16px);
  }
  #slider {
    width: 20rem;
    accent-color: #3a6;
  }
  #calrow {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  #calnow {
    opacity: 0.7;
  }
  #rot {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  #rot input[type="number"] {
    font: inherit;
    width: 4rem;
    color: #4b8b4b;
    background: #000;
    border: 1px solid #132;
    padding: 0.2rem 0.3rem;
  }
  #rot input:disabled {
    opacity: 0.4;
  }
  #rot input[type="checkbox"] {
    accent-color: #3a6;
  }
  #pick button[aria-pressed="true"] {
    color: #7cf65d;
    border-color: #3a6;
  }
</style>
<canvas id="screen" width="16" height="16"></canvas>
<div id="pick"></div>
<div id="rot">
  <label><input id="roton" type="checkbox" /> auto-rotate</label>
  <label
    >every
    <input id="rotmins" type="number" min="1" max="1440" step="1" /> min</label
  >
</div>
<div id="status">connecting…</div>
<div id="life">
  <span id="modes" hidden
    >actual <button id="mratio">ratio</button><button id="msize">size</button
    ><button id="calopen">calibrate</button></span
  >
  <div id="cal" hidden>
    <p>
      Hold a credit card against the screen and drag until the bar matches its
      long edge. Every card is 85.6 mm — it is the one ruler everyone owns.
    </p>
    <div id="card"></div>
    <input id="slider" type="range" min="1.0" max="12.0" step="0.01" />
    <div id="calrow">
      <button id="caldone">done</button>
      <button id="calreset">reset</button>
      <span id="calnow"></span>
    </div>
  </div>
</div>
<script>
  const canvas = document.getElementById("screen");
  const status = document.getElementById("status");
  const pick = document.getElementById("pick");
  const ctx = canvas.getContext("2d", { alpha: false });

  let meta = null,
    atlas = [],
    solid = [],
    blank = [],
    frames = 0,
    cells = 0;

  const hex = (v) => "#" + v.toString(16).padStart(6, "0");

  // One atlas per palette colour: every glyph drawn in that colour, once. A cell
  // is then a fillRect plus one drawImage, with no per-pixel work in JS.
  function buildAtlases(m) {
    const { glyph_w: gw, glyph_h: gh, glyphs, palette } = m;
    atlas = palette.map((colour) => {
      const c = new OffscreenCanvas(glyphs.length * gw, gh);
      const g = c.getContext("2d");
      const img = g.createImageData(c.width, gh);
      const [r, gr, b] = [
        (colour >> 16) & 255,
        (colour >> 8) & 255,
        colour & 255,
      ];
      glyphs.forEach((rows, i) => {
        for (let y = 0; y < gh; y++) {
          const line = rows[y];
          for (let x = 0; x < gw; x++) {
            if (!(line & (0x80 >> x))) continue;
            const o = (y * c.width + i * gw + x) * 4;
            img.data[o] = r;
            img.data[o + 1] = gr;
            img.data[o + 2] = b;
            img.data[o + 3] = 255;
          }
        }
      });
      g.putImageData(img, 0, 0);
      return c;
    });
    // Glyphs that are wholly on or wholly off need no blit at all — that is
    // what `blocks` is made of, and it is 130k cells.
    solid = glyphs.map((rows) => rows.every((v) => v === 0xff));
    blank = glyphs.map((rows) => rows.every((v) => v === 0x00));
  }

  // The tailnet is the auth boundary (the ts-auth sidecar 403s anything without
  // an identity header), so there is nothing to send but the name.
  async function select(name) {
    const res = await fetch("/select?saver=" + encodeURIComponent(name), {
      method: "POST",
      cache: "no-store",
    });
    // A rejected name leaves the panel alone; say so rather than lying about it.
    if (!res.ok) {
      status.textContent = "cannot draw " + name;
      return;
    }
    // The switch bumps the mirror's epoch, so the server is about to close the
    // stream. Abort it ourselves instead of waiting to be dropped: a chunked
    // response closed mid-read REJECTS reader.read() (Safari: "Load failed")
    // rather than resolving done, so letting the server do it turned every
    // successful switch into a two-second error banner.
    status.textContent = "switching to " + name + "\u2026";
    switching = true;
    abort();
  }

  // Rotation. The interval is the pod's, not this tab's — /meta carries it, so
  // a second browser shows what the first one set rather than its own guess.
  // Seconds on the wire because that is the renderer's unit and what
  // SAVER_ROTATE_SECS is in; minutes here because that is what a person asks
  // for. An interval that is not a whole number of minutes (only reachable from
  // the env var) shows rounded.
  const roton = document.getElementById("roton");
  const rotmins = document.getElementById("rotmins");
  // What the box goes back to when it is ticked again — turning rotation off
  // must not also forget the interval, which posting 0 does on the server.
  let rotlast = 5;

  function showRotate(secs) {
    roton.checked = secs > 0;
    if (secs > 0) rotlast = Math.max(1, Math.round(secs / 60));
    rotmins.value = rotlast;
    rotmins.disabled = !roton.checked;
  }

  async function setRotate(mins) {
    const res = await fetch("/rotate?mins=" + mins, {
      method: "POST",
      cache: "no-store",
    });
    if (!res.ok) {
      status.textContent = "cannot rotate every " + mins + " min";
      return;
    }
    showRotate((await res.json()).rotate_secs);
  }

  roton.onchange = () => setRotate(roton.checked ? rotlast : 0);
  rotmins.onchange = () => {
    rotlast = Math.min(1440, Math.max(1, Math.round(+rotmins.value) || 1));
    setRotate(roton.checked ? rotlast : 0);
  };

  function buildPicker(m) {
    pick.replaceChildren(
      ...(m.savers || []).map((name) => {
        const b = document.createElement("button");
        b.textContent = name;
        b.setAttribute("aria-pressed", name === m.saver);
        b.onclick = () => select(name);
        return b;
      }),
    );
  }

  // A 1920-wide canvas in a smaller window is a fractional downscale, and
  // nearest-neighbour picks one source pixel per destination pixel, so entire
  // scanlines vanish — a one-cell-tall streak or a one-pixel grid line can
  // disappear completely. Smoothing averages instead of dropping, which is the
  // honest rendering when the mirror cannot show every pixel. Above 1:1 we want
  // hard edges back, because that is what the panel itself looks like.
  // ACTUAL SIZE
  //
  // CSS cannot know how big the viewer's monitor is. `width: 200mm` is 200mm
  // only if the browser's CSS inch happens to be a real inch, which on a scaled
  // or HiDPI display it is not — so the viewer calibrates once, against the one
  // ruler everybody owns: an ID-1 card (ISO/IEC 7810) is 85.60mm, to a tenth of
  // a millimetre, in every wallet on earth.
  //
  // Per-viewer and per-device, so it lives in localStorage and never travels.
  // Wrapped because a private window or blocked site data throws on access
  // rather than returning null.
  const CARD_MM = 85.6;
  const PXMM = "mirror.pxPerMm";

  // 96 CSS px to the inch is what the spec nominally says, and it is the only
  // guess available before the viewer has measured anything. It is within a few
  // per cent on an unscaled display and can be well out on a scaled or HiDPI
  // one — which is the whole reason `calibrate` exists. Being approximately
  // right by default beats being exactly right only for people who click.
  const NOMINAL_PX_MM = 96 / 25.4;

  function calibrated() {
    try {
      const v = parseFloat(localStorage.getItem(PXMM));
      return v > 0 ? v : 0;
    } catch {
      return 0;
    }
  }

  // The view state lives here, not in storage: a saver switch or a rotation
  // re-reads /meta, and that must not hand the viewer back a different size.
  // Storage only seeds it, and a private window that cannot store still keeps
  // its calibration for as long as the tab is open.
  let pxmm = calibrated();
  // The slider's value while calibrate is open, 0 otherwise — the size being
  // previewed, which survives a switch just as the committed one does.
  let preview = 0;

  function pxPerMm() {
    return preview || pxmm || NOMINAL_PX_MM;
  }

  function setPxPerMm(v) {
    pxmm = v;
    try {
      if (v) localStorage.setItem(PXMM, String(v));
      // Removing the key rather than storing the nominal value, so a later
      // browser with a better answer is not permanently overridden by today's
      // guess.
      else localStorage.removeItem(PXMM);
    } catch {
      /* calibration just does not persist; the session still works */
    }
  }

  // Two ways to be faithful to the panel, and they are not the same thing:
  //
  //   ratio — the panel's SHAPE, scaled to fit the window. Always exactly
  //           right, because it needs nothing the browser cannot know.
  //   size  — the panel's SHAPE AND PHYSICAL SIZE. Needs px-per-mm, which
  //           only the viewer can supply, so it is exact after `calibrate`
  //           and a nominal-inch guess before.
  //
  // Remembered per device: someone who wants one of them usually wants it
  // every time.
  const MODEKEY = "mirror.mode";
  let mode = "size";
  try {
    const m = localStorage.getItem(MODEKEY);
    if (m === "ratio" || m === "size") mode = m;
  } catch {
    /* keep the default */
  }

  function setMode(m) {
    mode = m;
    try {
      localStorage.setItem(MODEKEY, m);
    } catch {
      /* the choice just does not persist */
    }
    applyActualSize();
  }

  const modes = document.getElementById("modes");
  const mratio = document.getElementById("mratio");
  const msize = document.getElementById("msize");
  const cal = document.getElementById("cal");
  const slider = document.getElementById("slider");
  const card = document.getElementById("card");
  const calnow = document.getElementById("calnow");

  // Without a measured panel `size` cannot be honest about millimetres, so it
  // is not offered — but `mode` is left alone, so the viewer's choice is still
  // there if a later /meta does carry one.
  const sized = () => mode === "size" && meta && meta.panel_mm > 0;

  // The PANEL's shape, not the framebuffer's. With SAVER_PIXEL_ASPECT set the
  // renderer draws everything `aspect` per-cent too tall on purpose, because
  // the monitor squashes it back; the page has no monitor, so it squashes
  // here. Displayed shape only — the pixels are the framebuffer's.
  const aspect = () =>
    (meta.panel_w * meta.pixel_aspect) / (meta.panel_h * 100);

  // The box `ratio` fits into: the window, less everything else on the page
  // and the pinned calibrate panel's reserved strip.
  function room() {
    const st = getComputedStyle(document.body);
    let h = innerHeight - parseFloat(st.paddingBottom);
    for (const el of document.body.children) {
      if (el === canvas || !el.offsetHeight) continue;
      h -= el.offsetHeight + parseFloat(st.rowGap);
    }
    // 2 for the canvas border, 8 so the page does not sit flush to an edge.
    return [innerWidth - 10, h - 10];
  }

  function paintModes() {
    mratio.setAttribute("aria-pressed", String(!sized()));
    msize.setAttribute("aria-pressed", String(sized()));
    // Say WHICH number `size` is using: uncalibrated it is the browser's
    // nominal inch, a guess, and a viewer holding the page against the real
    // panel deserves to know that before concluding the maths is wrong.
    msize.textContent = pxmm ? "size ✓" : "size";
    msize.title = pxmm
      ? "matched to your screen"
      : "using the browser's nominal 96dpi — calibrate to make it exact";
  }

  function applyActualSize() {
    if (!meta) return;
    modes.hidden = !meta.panel_mm;
    paintModes();
    const ar = aspect();
    let w, h;
    if (sized()) {
      // A fixed physical size: an oversized panel must overflow and say so
      // rather than be shrunk.
      w = meta.panel_mm * pxPerMm();
      h = w / ar;
      if (w > innerWidth || h > innerHeight - 48) {
        msize.textContent = "size — too big for this window";
      }
    } else {
      const [rw, rh] = room();
      w = Math.max(16, Math.min(rw, rh * ar));
      h = w / ar;
    }
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    fitScaling();
  }

  function drawCard() {
    const k = parseFloat(slider.value);
    card.style.width = CARD_MM * k + "px";
    calnow.textContent = `${(k * 25.4).toFixed(0)} dpi · panel ${(meta.panel_mm * k) | 0}px wide`;
  }

  // Open or close calibrate. The panel is pinned to the bottom of the window,
  // so the body reserves its height once here — never while dragging, which
  // is what kept moving the slider.
  function showCal(open) {
    cal.hidden = !open;
    document.body.style.paddingBottom = open ? cal.offsetHeight + "px" : "";
    preview = open ? parseFloat(slider.value) : 0;
    applyActualSize();
  }

  mratio.onclick = () => setMode("ratio");
  msize.onclick = () => setMode("size");
  document.getElementById("calopen").onclick = () => {
    slider.value = pxPerMm();
    drawCard();
    showCal(cal.hidden);
  };
  // A live preview while dragging: the canvas resizes above the slider, so
  // the viewer sees the panel grow toward its real size rather than having to
  // commit and then judge.
  slider.oninput = () => {
    preview = parseFloat(slider.value);
    drawCard();
    applyActualSize();
  };
  document.getElementById("calreset").onclick = () => {
    setPxPerMm(0);
    slider.value = NOMINAL_PX_MM;
    slider.oninput();
  };
  document.getElementById("caldone").onclick = () => {
    setPxPerMm(parseFloat(slider.value));
    showCal(false);
    // Calibrating is only meaningful for `size`, so finishing implies it.
    setMode("size");
  };

  // Width of the largest cell count this scene can report, so both counters
  // below are padded to the same fixed width.
  let padTo = 1;

  function pad(v) {
    return String(v).padStart(padTo, "0");
  }

  function fitScaling() {
    const shown = canvas.clientWidth;
    if (!shown) return;
    const ratio = shown / canvas.width;
    const crisp = ratio >= 1 || Number.isInteger(1 / ratio);
    canvas.style.imageRendering = crisp ? "pixelated" : "auto";
  }
  addEventListener("resize", applyActualSize);

  function applyMeta(m) {
    meta = m;
    buildPicker(m);
    showRotate(m.rotate_secs);
    // The PANEL, not the cell grid — see Grid::new on why they differ.
    //
    // No fallback for a /meta missing these: this page is include_str!'d into
    // the binary that serves /meta, so a page holding this code is always
    // talking to a pod that sends them.
    canvas.width = m.panel_w;
    canvas.height = m.panel_h;
    ctx.imageSmoothingEnabled = false;
    padTo = String(m.cols * m.rows).length;
    applyActualSize();
    ctx.fillStyle = hex(m.ground);
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    buildAtlases(m);
  }

  // `base` is the record's offset inside the shared receive buffer: the
  // caller hands over one long-lived DataView rather than slicing a new one
  // per record.
  function draw(view, base) {
    const { cols, cell_w: cw, cell_h: ch, glyph_w: gw, glyph_h: gh } = meta;
    const n = view.getUint32(base, true);
    for (let k = 0; k < n; k++) {
      const o = base + 4 + k * 8;
      const i = view.getUint32(o, true);
      const cell = view.getUint32(o + 4, true);
      const glyph = cell & 0xffff,
        colour = cell >>> 16;
      const x = (i % cols) * cw,
        y = ((i / cols) | 0) * ch;
      if (solid[glyph]) {
        ctx.fillStyle = hex(meta.palette[colour]);
        ctx.fillRect(x, y, cw, ch);
        continue;
      }
      ctx.fillStyle = hex(meta.ground);
      ctx.fillRect(x, y, cw, ch);
      if (!blank[glyph])
        ctx.drawImage(atlas[colour], glyph * gw, 0, gw, gh, x, y, cw, ch);
    }
    frames++;
    cells += n;
    return n;
  }

  // Set while a switch we initiated is tearing the stream down, so the loop can
  // tell "the user pressed a button" apart from "the pod went away".
  let switching = false;
  let ctl = new AbortController();
  const abort = () => ctl.abort();

  async function run() {
    ctl = new AbortController();
    const res = await fetch("/meta", { cache: "no-store", signal: ctl.signal });
    if (!res.ok) throw new Error("no display yet (" + res.status + ")");
    const m = await res.json();
    applyMeta(m);

    // Hand back the epoch /meta was built for. /select can land between these
    // two fetches, and then the cells belong to a saver whose geometry, palette
    // and glyph table are not the ones just applied — which drew the other
    // saver's frames as grey blocks against the old grid, with nothing to
    // recover it. The server refuses the mismatch instead.
    const stream = await fetch("/stream?epoch=" + m.epoch, {
      cache: "no-store",
      signal: ctl.signal,
    });
    // 409 is that refusal. Re-read /meta at once rather than after the 2s
    // reconnect backoff, which would black the panel out on every switch.
    if (stream.status === 409) {
      switching = true;
      throw new Error("scene changed");
    }
    if (!stream.ok) throw new Error("stream " + stream.status);
    const reader = stream.body.getReader();
    // Records straddle chunk boundaries, so hold a buffer and consume only
    // whole ones. Grow-only, with a read offset: the obvious
    // allocate-and-copy-everything per chunk is O(n^2) in chunks per frame,
    // and on `blocks` (37k changed cells a frame, 4.4 MB/s) that measured ~3
    // MB/frame of garbage and showed up as GC spikes. Here a chunk is one
    // `set` into spare room, and consumed bytes are reclaimed by resetting the
    // offset — a compaction only happens when a record really did straddle.
    let buf = new Uint8Array(1 << 16);
    let view = new DataView(buf.buffer);
    let len = 0, // bytes written
      off = 0; // bytes already drawn
    for (;;) {
      const { value, done } = await reader.read();
      // The server ends the stream when the epoch moves, which SAVER_ROTATE_SECS
      // now makes a routine event rather than only a click. Treat it as a
      // switch: reconnect at once and say nothing. Waiting out the 2s backoff
      // would put an error banner on the page every rotation. A pod that really
      // went away fails on the next /meta and gets the banner there.
      if (done) {
        switching = true;
        throw new Error("stream ended");
      }
      if (len + value.length > buf.length) {
        // Drop what has been drawn, and only then consider growing. A full
        // keyframe on `blocks` is ~1 MB, so the buffer does settle larger than
        // its initial size — it just stops churning once it has.
        buf.copyWithin(0, off, len);
        len -= off;
        off = 0;
        if (len + value.length > buf.length) {
          let cap = buf.length;
          while (cap < len + value.length) cap *= 2;
          const grown = new Uint8Array(cap);
          grown.set(buf.subarray(0, len));
          buf = grown;
          view = new DataView(buf.buffer);
        }
      }
      buf.set(value, len);
      len += value.length;
      let n = -1;
      for (;;) {
        if (len - off < 4) break;
        const need = 4 + view.getUint32(off, true) * 8;
        if (len - off < need) break;
        n = draw(view, off);
        off += need;
      }
      // Once per chunk, not once per record: this is a layout-invalidating
      // innerHTML write, and at 30fps the inner loop runs it for every frame
      // that arrived in the same read.
      // Zero-padded to the widest value each field can take — cols*rows — so
      // the line keeps a fixed width. Unpadded, every frame reflows the text
      // and the whole status row twitches sideways 30 times a second, which
      // reads as the page being broken rather than as the numbers changing.
      if (n >= 0)
        status.innerHTML =
          `<b>${meta.saver}</b> · ${meta.cols}x${meta.rows} cells · ` +
          `${pad(n)} changed · ${pad(Math.round(cells / Math.max(frames, 1)))} avg`;
      // The common case: the chunk ended on a record boundary, so the whole
      // buffer is free again without moving a byte.
      if (off === len) off = len = 0;
    }
  }

  // The stream ends on modeset (a new palette and geometry), on a pod restart,
  // and when the tab was backgrounded long enough to be culled. Reconnecting is
  // the whole recovery story — /meta is re-read, so a changed saver just works.
  (async function loop() {
    for (;;) {
      try {
        await run();
      } catch (e) {
        // A switch we asked for is not a failure: reconnect at once and say
        // nothing. Only a real drop gets the banner and the backoff.
        if (switching) {
          switching = false;
          continue;
        }
        status.textContent = e.message + " — retrying";
      }
      await new Promise((r) => setTimeout(r, 2000));
    }
  })();
</script>
