[package]
name = "fbfire"
version = "0.6.0"
edition = "2021"
description = "HDMI screensavers drawn straight into a DRM/KMS dumb buffer"
license = "MIT"

# The BINARY is renamed, not the package: Cargo.lock records the package name
# and both the Dockerfile and CI build with --locked, so renaming the package
# would force a lock regen for no behaviour change.
[[bin]]
name = "screensaver"
path = "src/main.rs"

[dependencies]
# Talks to /dev/dri/card0 with raw ioctls — no libdrm, so the binary links
# nothing outside libc and a musl build is fully static (hence FROM scratch).
drm = "0.14"
drm-fourcc = "2.2"
# Already transitive via drm; declared so the two signal handlers don't need
# hand-written extern blocks.
libc = "0.2"
# Safe u8 -> u32 view of the mapped buffer. A 4-byte-per-pixel slice copy per
# pixel was the hot path; one u32 store is a single bounds-checked write.
bytemuck = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
