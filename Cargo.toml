[package]
name = "fbfire"
version = "0.6.0"
edition = "2021"
description = "HDMI screensavers drawn straight into a DRM/KMS dumb buffer"
license = "MIT"

# The BINARY is renamed, not the package: Cargo.lock records the package name
# and both the Dockerfile and CI build with --locked, so renaming the package
# would force a lock regen for no behaviour change.
[[bin]]
name = "screensaver"
path = "src/main.rs"

[dependencies]
# Talks to /dev/dri/card0 with raw ioctls — no libdrm, so the binary links
# nothing outside libc and a musl build is fully static (hence FROM scratch).
drm = "0.14"
drm-fourcc = "2.2"
# Already transitive via drm; declared so the two signal handlers don't need
# hand-written extern blocks.
libc = "0.2"
# Safe u8 -> u32 view of the mapped buffer. A 4-byte-per-pixel slice copy per
# pixel was the hot path; one u32 store is a single bounds-checked write.
bytemuck = "1"

[features]
# Doom, compiled in from doomgeneric (GPL-2.0). Off by default: a binary built
# with it is GPL as a whole, and it needs a C compiler. The `-doom` image is
# this build; the default image never sees the C.
doom = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true, features = ["parallel"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Pedantic on, minus the lints this codebase breaks on purpose. CI, hk and
# `mise run clippy` all read this table, so they cannot disagree.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel and sample arithmetic: every cast is into a range the code already
# clamped, and `T::from` in dense maths reads worse than `as` without being safer.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
# x, y, z, r, g, b, dx, dy: the names the maths uses.
many_single_char_names = "allow"
similar_names = "allow"
# A saver's constructor reads every one of its knobs; splitting it scatters them.
too_many_lines = "allow"
# The ascii.rest ports reproduce JavaScript's arithmetic for golden-exact output;
# `midpoint` rounds signed integers differently and exact float compares are the
# point of the goldens.
manual_midpoint = "allow"
float_cmp = "allow"
# A const declared beside the one loop that uses it is the point of declaring it.
items_after_statements = "allow"
# 0xRRGGBB colours: `_` grouping would split a channel.
unreadable_literal = "allow"
# `if p > 0.7 { 0 } else { 1 }` reads as a palette table and `x & 7 == 0` as a
# one-in-eight roll; `u16::from(cond)` and `trailing_zeros() >= 3` hide both.
bool_to_int_with_if = "allow"
verbose_bit_mask = "allow"
