name: image

# The screensaver image was built and pushed BY HAND until 2026-09-06, which is
# how it ended up with a renderer nobody noticed had stopped working: the Talos
# v1.14.0 upgrade removed CONFIG_FB from the kernel, /dev/fb0 vanished fleet-wide,
# and the pod sat idle logging "framebuffer not present" while the monitor showed
# a bare Linux console. A hand-built image has no CI to notice any of that.
#
# Every PR builds; main builds on any change but docs. Pushes only from main —
# a PR gets a build (so a broken renderer fails review) without publishing
# anything.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  # Every PR, docs-only included: `build` is the required check that GitHub
  # auto-merge waits on, and a check that never runs never reports.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # arm64 native, not QEMU: the consumer is a Raspberry Pi 5 cluster and there
    # is no amd64 consumer. Native also keeps the compile honest — a warning here
    # is a warning on the target.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/northisup/afterglow
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # src/font.rs is generated and committed so the image build stays a pure
      # `cargo build --locked` with no Python in the build stage. Regenerating
      # here is what stops the table drifting from the .hex it claims to be from.
      - name: font table matches its source
        run: |
          python3 tools/genfont.py tools/unifont-subset.hex -o src/font.rs
          git --no-pager diff --exit-code -- src/font.rs

      # Warnings are errors, and clippy runs too. This is a few hundred lines of
      # pixel-pushing that writes into a mapped display buffer on a privileged
      # pod; the point of this workflow is that nothing here reaches a node
      # unexamined again. Run before the image build so a lint failure is
      # reported as a lint failure rather than a docker build failure.
      #
      # The dump run is the only renderer check possible here: there is no
      # monitor, and the two failures that matter — a black first frame, and a
      # saver writing pixels it never reports as damaged — are invisible in
      # review and show up only on the panel.
      #
      # SAVER_DUMP exits non-zero on the second. The byte count below does NOT
      # catch the first, despite reading like it should: a saver that skipped
      # its first-frame full paint has long since converged by the end of the
      # run. Measured with `first` forced false — ascii 747065, blocks 6220817,
      # matrix 435293 non-NUL bytes, all far over the threshold. What actually
      # catches it is the unit test
      # `grid::tests::frame_zero_paints_every_cell_then_only_changes`, run by the
      # `cargo test` below. The byte count's real job is narrower: a saver that
      # renders nothing at all.
      #
      # It is the BRIGHTEST of frames 1..19, not the last one: `zot` is a bolt
      # and then a second or three of darkness, so its frame 19 is legitimately
      # black and a last-frame sample would call that a blank render.
      #
      # Frame 0 is excluded because it is lit by construction, not by the saver:
      # `Grid::flush`'s `first` arm blits every cell whether the saver drew into
      # it or not. Include it and a saver that paints nothing at all still scores
      # a full panel, which is the one failure this check exists to catch.
      - name: fmt, clippy, tests, render check
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -eu -c '
            apk add --no-cache musl-dev >/dev/null
            rustup component add rustfmt clippy >/dev/null
            cargo fmt --check
            cargo clippy --release --locked --all-targets -- -D warnings
            cargo test --release --locked
            cargo build --release --locked
            # SAVER_HTTP=off: the dump drives the web mirror too, and pacing it
            # at SAVER_FPS is right for a browser and wrong for a render check.
            # Coverage for the mirror itself is in the cargo test above, which
            # is where its HTTP round-trip and never-block-the-display
            # invariants live.
            for s in ascii blocks matrix toasters toasters2 toasters3 city life doodles strings tactiles pov hardrain zot podracer speeder marble xwing; do
              SAVER=$s SAVER_HTTP=off SAVER_DUMP=/tmp/dump-$s SAVER_DUMP_FRAMES=20 \
                SAVER_DUMP_EVERY=1 ./target/release/screensaver
              # DISTINCT FRAMES, not lit bytes. Counting non-NUL bytes only
              # discriminates for a saver whose background is pure black: zot
              # paints 0x0e1221, so a wholly dark zot frame still counts ~6M of
              # its 6.2M bytes and sails past any byte threshold. Frame 0 is
              # excluded for the opposite reason -- the `first` arm of
              # Grid::flush
              # blits every cell whatever the saver drew, so a saver that paints
              # nothing still scores a full panel there.
              #
              # What "renders nothing" really means is that the panel never
              # changes, so compare the frames to each other. Header length
              # varies with the panel size, which is why this hashes whole files
              # rather than trying to parse pixels out of them.
              moved=$(md5sum /tmp/dump-$s/frame-0000[1-9].ppm \
                             /tmp/dump-$s/frame-0001[0-9].ppm 2>/dev/null \
                        | sort -u -k1,1 | wc -l)
              [ "${moved:-0}" -gt 1 ] || {
                echo "$s: frames 1..19 are all identical" \
                     "($(ls /tmp/dump-$s/*.ppm 2>/dev/null | wc -l) frames dumped)"
                exit 1
              }
              rm -rf /tmp/dump-$s
            done
            # Paced: the emulator runs on its own thread at its own 59.7 Hz.
            # The damage self-check is the point here; whether the bundled
            # cartridges play is for the gameboy::tests in cargo test. Rebound
            # (seed 4) shows boot static and a still title for its first ~100
            # frames, so movement is checked over 100..299.
            GAMEBOY_SEED=4 SAVER=gameboy SAVER_HTTP=off SAVER_DUMP=/tmp/dump-gameboy \
              SAVER_DUMP_FRAMES=300 SAVER_DUMP_EVERY=1 SAVER_DUMP_PACED=1 ./target/release/screensaver
            moved=$(md5sum /tmp/dump-gameboy/frame-00[12]??.ppm | sort -u -k1,1 | wc -l)
            [ "$moved" -gt 1 ] || { echo "gameboy: frames are all identical"; exit 1; }
          '

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest homelab-gitops pins in k8s/apps/screensaver/deployment.yaml.
      # Reading it back needs read:packages, which neither CI nor a local gh has
      # — so print it here, or it exists in no reachable place.
      - name: digest
        if: steps.build.outputs.digest != ''
        run: |
          echo "ghcr.io/northisup/afterglow@${{ steps.build.outputs.digest }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # The GPL variant: the same checks with doomgeneric (GPL-2.0-or-later) and
  # Micropolis (GPL-3.0) compiled in, then its own image. GPL-3.0 as a whole,
  # so it ships under separate tags and never replaces the MIT image: `-gpl`,
  # and `-doom`, its name from before Micropolis, so existing pins keep
  # resolving. The Doom tests need a real IWAD: Freedoom, checksummed by
  # tools/freedoom.sh.
  gpl:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/northisup/afterglow
          tags: |
            type=ref,event=branch,suffix=-gpl
            type=sha,format=long,suffix=-gpl
            type=raw,value=latest-gpl,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-doom
            type=sha,format=long,suffix=-doom
            type=raw,value=latest-doom,enable={{is_default_branch}}

      # The binary must stay one static file under musl, C++ runtime and
      # all: a NEEDED entry means libstdc++ (or anything) linked dynamically,
      # which FROM scratch cannot satisfy.
      - name: clippy, tests, render check, static link (--features doom,micropolis)
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -eu -c '
            apk add --no-cache musl-dev gcc g++ binutils curl >/dev/null
            rustup component add clippy >/dev/null
            wad="$PWD/$(tools/freedoom.sh)"
            f=doom,micropolis
            cargo clippy --release --locked --all-targets --features $f -- -D warnings
            DOOM_TEST_WAD="$wad" cargo test --release --locked --features $f
            cargo build --release --locked --features $f
            if readelf -d target/release/screensaver | grep NEEDED; then
              echo "screensaver links a shared library"; exit 1
            fi
            # Paced, so the engines (wall-clock, own threads) get to draw.
            SAVER=doom SAVER_HTTP=off SAVER_DUMP=/tmp/dump-doom SAVER_DUMP_FRAMES=90 \
              SAVER_DUMP_EVERY=1 SAVER_DUMP_PACED=1 DOOM_WAD="$wad" ./target/release/screensaver
            moved=$(md5sum /tmp/dump-doom/frame-000[1-8]?.ppm | sort -u -k1,1 | wc -l)
            [ "$moved" -gt 1 ] || { echo "doom: frames are all identical"; exit 1; }
            SAVER=micropolis SAVER_HTTP=off SAVER_DUMP=/tmp/dump-mp SAVER_DUMP_FRAMES=90 \
              SAVER_DUMP_EVERY=1 SAVER_DUMP_PACED=1 MICROPOLIS_YEAR_SECS=1 \
              ./target/release/screensaver
            moved=$(md5sum /tmp/dump-mp/frame-000[1-8]?.ppm | sort -u -k1,1 | wc -l)
            [ "$moved" -gt 1 ] || { echo "micropolis: frames are all identical"; exit 1; }
            ls -l target/release/screensaver
          '

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: gpl
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gpl
          cache-to: type=gha,mode=max,scope=gpl

      - name: digest
        if: steps.build.outputs.digest != ''
        run: |
          echo "ghcr.io/northisup/afterglow@${{ steps.build.outputs.digest }} (-gpl, -doom)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
