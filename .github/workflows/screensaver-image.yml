name: screensaver-image

# The screensaver image was built and pushed BY HAND until 2026-09-06, which is
# how it ended up with a renderer nobody noticed had stopped working: the Talos
# v1.14.0 upgrade removed CONFIG_FB from the kernel, /dev/fb0 vanished fleet-wide,
# and the pod sat idle logging "framebuffer not present" while the monitor showed
# a bare Linux console. A hand-built image has no CI to notice any of that.
#
# Builds on any change to the image sources. Pushes only from main — a PR gets a
# build (so a broken renderer fails review) without publishing anything.

on:
  push:
    branches: [main]
    paths:
      - "k8s/apps/screensaver/image/**"
      - ".github/workflows/screensaver-image.yml"
  pull_request:
    paths:
      - "k8s/apps/screensaver/image/**"
      - ".github/workflows/screensaver-image.yml"
  workflow_dispatch:

jobs:
  build:
    # arm64 native, not QEMU: the consumer is a Raspberry Pi 5 cluster and there
    # is no amd64 consumer. Native also keeps the compile honest — a warning here
    # is a warning on the target.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/northisup/screensaver
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # src/font.rs is generated and committed so the image build stays a pure
      # `cargo build --locked` with no Python in the build stage. Regenerating
      # here is what stops the table drifting from the .hex it claims to be from.
      - name: font table matches its source
        working-directory: k8s/apps/screensaver/image
        run: |
          python3 tools/genfont.py tools/unifont-subset.hex -o src/font.rs
          git --no-pager diff --exit-code -- src/font.rs

      # Warnings are errors, and clippy runs too. This is a few hundred lines of
      # pixel-pushing that writes into a mapped display buffer on a privileged
      # pod; the point of this workflow is that nothing here reaches a node
      # unexamined again. Run before the image build so a lint failure is
      # reported as a lint failure rather than a docker build failure.
      #
      # The dump run is the only renderer check possible here: there is no
      # monitor, and the two failures that matter — a black first frame, and a
      # saver writing pixels it never reports as damaged — are invisible in
      # review and show up only on the panel.
      #
      # SAVER_DUMP exits non-zero on the second. The byte count below does NOT
      # catch the first, despite reading like it should: it samples frame 19, by
      # which point a saver that skipped its first-frame full paint has long
      # since converged. Measured with `first` forced false — ascii 747065,
      # blocks 6220817, matrix 435293 non-NUL bytes, all far over the threshold.
      # What actually catches it is the unit test
      # `grid::tests::frame_zero_paints_every_cell_then_only_changes`, run by the
      # `cargo test` below. The byte count's real job is narrower: a saver that
      # renders nothing at all.
      - name: fmt, clippy, tests, render check
        working-directory: k8s/apps/screensaver/image
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -eu -c '
            apk add --no-cache musl-dev >/dev/null
            rustup component add rustfmt clippy >/dev/null
            cargo fmt --check
            cargo clippy --release --locked --all-targets -- -D warnings
            cargo test --release --locked
            cargo build --release --locked
            # SAVER_HTTP=off: the dump drives the web mirror too, and pacing it
            # at SAVER_FPS is right for a browser and wrong for a render check.
            # Coverage for the mirror itself is in the cargo test above, which
            # is where its HTTP round-trip and never-block-the-display
            # invariants live.
            for s in ascii blocks matrix; do
              SAVER=$s SAVER_HTTP=off SAVER_DUMP=/tmp/dump-$s SAVER_DUMP_FRAMES=20 \
                SAVER_DUMP_EVERY=19 ./target/release/screensaver
              lit=$(tr -d "\000" < /tmp/dump-$s/frame-00019.ppm | wc -c)
              [ "$lit" -gt 1000 ] || { echo "$s rendered a blank frame"; exit 1; }
            done
          '

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: k8s/apps/screensaver/image
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest deployment.yaml pins. Reading it back needs read:packages,
      # which neither CI nor a local gh has — so print it here, or it exists in
      # no reachable place.
      - name: digest
        if: steps.build.outputs.digest != ''
        run: |
          echo "ghcr.io/northisup/screensaver@${{ steps.build.outputs.digest }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
