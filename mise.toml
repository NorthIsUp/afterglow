[tools]
rust = { version = "stable", components = "rustfmt,clippy" }
hk   = "latest"
pkl  = "latest"
node = "lts"
"npm:prettier" = "3"
lychee = "latest"

[settings]
experimental = true

# --release --locked everywhere, matching CI and the Dockerfile: a debug build
# hides the frame-rate bugs, and an unlocked one tests a dependency set the
# image never ships.

[tasks.build]
description = "Build release"
run         = "cargo build --release --locked"

[tasks.test]
description = "Run tests"
run         = "cargo test --release --locked"

[tasks.build-doom]
description = "Build release with Doom compiled in (GPL as a whole; see THIRD_PARTY.md)"
run         = "cargo build --release --locked --features doom"

[tasks.test-doom]
description = "Run tests with Doom compiled in, against Freedoom (downloaded once)"
run         = 'DOOM_TEST_WAD="$PWD/$(tools/freedoom.sh)" cargo test --release --locked --features doom'

[tasks.bench-doom]
description = "Play every map of an episode headless, several times, and count autopilot exits"
usage       = '''
arg "[episode]" default="1" help="Doom episode, 1..4"
arg "[trials]" default="8" help="runs per map, each with its own random game"
'''
run         = 'tools/doom-bench/many.sh {{arg(name="episode")}} {{arg(name="trials")}}'

[tasks.clippy-doom]
description = "Run clippy on the Doom build"
run         = "cargo clippy --release --locked --all-targets --features doom -- -D warnings"

[tasks.build-gpl]
description = "Build release with Doom and Micropolis compiled in, the -gpl image's binary (GPL as a whole)"
run         = "cargo build --release --locked --features doom,micropolis"

[tasks.test-micropolis]
description = "Run tests with Micropolis compiled in (needs a C++ compiler)"
run         = "cargo test --release --locked --features micropolis"

[tasks.clippy-gpl]
description = "Run clippy on the GPL build"
run         = "cargo clippy --release --locked --all-targets --features doom,micropolis -- -D warnings"

[tasks.bench-micropolis]
description = "Grow a city headless at full speed and print the mayor's year-by-year numbers"
usage       = '''
arg "[seed]" default="5" help="terrain and mayor seed"
arg "[years]" default="100" help="city years to run"
'''
run         = 'MP_SEED={{arg(name="seed")}} MP_YEARS={{arg(name="years")}} cargo test --release --locked --features micropolis micropolis::tests::bench -- --ignored --nocapture'

[tasks.lint]
description = "Run linters"
run         = "hk check"

[tasks.fix]
description = "Auto-fix lint issues"
run         = "hk fix"

[tasks.clippy]
description = "Run clippy"
run         = "cargo clippy --release --locked --all-targets -- -D warnings"

[tasks.fmt]
description = "Format code"
run         = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting"
run         = "cargo fmt --all -- --check"

[tasks.font]
description = "Regenerate src/font.rs from the vendored Unifont subset"
run         = "python3 tools/genfont.py tools/unifont-subset.hex -o src/font.rs && cargo fmt"

[tasks.media]
description = "Regenerate docs/media/: a GIF per saver plus the tour (all savers by default)"
depends     = ["build"]
tools       = { uv = "latest", "cargo:gifski" = "1" }
usage       = '''
arg "[savers]..." help="Savers to render; none renders every saver and the tour"
'''
run         = "uv run tools/media.py"
