# mizu-core 1.3.0, vendored for afterglow: no zstd (C), no file I/O, raw
# RGB555 frames, RAM peeks. See src/lib.rs and THIRD_PARTY.md.
[package]
edition = "2021"
name = "mizu-core"
version = "1.3.0"
authors = ["Amjad Alsharafi <amjadsharafi10@gmail.com>"]
description = "The core library implementation of all Gameboy emulation for Mizu"
license = "MIT"
repository = "https://github.com/Amjad50/mizu"
publish = false

[lib]
name = "mizu_core"
path = "src/lib.rs"

[dependencies]
bitflags = "2.4"
byteorder = "1.3"
fixed-vec-deque = "0.1"
save_state = "0.2.0"
sha2 = "0.10"
thiserror = "2.0"
